<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Histórico das Ações Preventivas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: barra institucional + linha do tempo da temporada (meses → ações datadas), cada ação vira um dossiê com fotos, ficha e relato. Visual sempre claro. */
:root{
  color-scheme:light;
  --paper:#f4f6f8; --surface:#ffffff; --sunk:#eaeef2;
  --ink:#132130; --ink-2:#3a4757; --muted:#667385; --line:#d9dfe6;
  --navy:#0e2a45; --navy-2:#173b5e;
  --orange:#e2620f; --orange-soft:#fdeee3;
  --t-exe:#d0590c; --t-cap:#1f68b5; --t-ent:#2f8a5c; --t-evt:#7a4bb0; --t-reg:#5b6b7e; --t-gov:#0e2a45;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.in{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{background:var(--navy);color:#fff;position:relative}
.top::after{content:"";display:block;height:6px;background:linear-gradient(var(--orange) 0 2px,#c9d1da 2px 4px,var(--orange) 4px 6px)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.mark{height:44px;width:auto;flex:none;border-radius:5px;background:#fff;display:block}
.brand b{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:1.05rem;letter-spacing:.02em;display:block;line-height:1.1}
.brand span{font-size:.78rem;opacity:.72;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#c9d3de;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:6px 14px;white-space:nowrap}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.tab[aria-current="page"]{background:#fff;color:var(--navy);border-color:#fff}
.tab:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.more{flex:none;margin-left:-8px;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;color:#fff;opacity:.28;transition:opacity .15s}
.more svg{width:12px;height:12px;fill:currentColor}
.more:hover,.more[aria-current="page"]{opacity:.9}
.more:focus-visible{opacity:1;outline:2px solid var(--orange);outline-offset:2px}
@media (max-width:860px){.more{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}.top .in{position:relative}}
/* produtos */
.pgrp{display:grid;grid-template-columns:200px 1fr;gap:0 28px;padding-block:20px;border-top:1px solid var(--line)}
.pgrp:first-of-type{border-top:0}
.pgrp h2{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:1.2rem;margin:4px 0 0;line-height:1.15}
.pgrp h2 small{display:block;font-family:var(--body);font-stretch:100%;font-weight:500;font-size:.8rem;color:var(--muted);margin-top:4px}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));min-width:0}
@media (max-width:760px){.pgrp{grid-template-columns:1fr;gap:12px}}
.fe{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;margin:6px 0 8px;padding:22px 28px;border-radius:var(--r);background:var(--navy);color:#fff;text-decoration:none;position:relative;overflow:hidden;transition:background .15s}
.fe::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(var(--orange) 0 2px,#c9d1da 2px 3px,var(--orange) 3px 5px)}
.fe:hover{background:var(--navy-2)}
.fe:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.fe img{width:96px;height:96px;display:block}
.fe .eyebrow{color:#f6a76d}
.fe h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.05;margin:4px 0 6px}
.fe p{margin:0;color:#c4ccd6;max-width:80ch}
.fe em{font-style:normal;display:inline-block;margin-top:8px;font-size:.8rem;font-weight:600;color:#fff;opacity:.85;word-break:break-all}
.fe .go{font-weight:700;font-size:.9rem;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:8px 18px;white-space:nowrap}
@media (max-width:700px){.fe{grid-template-columns:auto 1fr;padding:18px;align-items:start}.fe img{width:64px;height:64px}.fe .go{grid-column:1/-1;justify-self:start}}
.prod .here{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:4px;padding:1px 6px;vertical-align:1px}
@media (max-width:860px){.top .in{flex-wrap:wrap;gap:10px}.tabs{width:100%}.tab{flex:1;text-align:center;padding:7px 10px}}
@media (max-width:560px){.tabs{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}.tab{white-space:normal;font-size:.72rem;letter-spacing:.04em;line-height:1.25;display:flex;align-items:center;justify-content:center}.brand span{display:none}.mark{height:38px}
  .gallery{--h:120px}.gallery.tall{--h:170px}}

/* capa */
.hero{padding-block:44px 26px}
@media (max-width:560px){.hero{padding-block:28px 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}.stat b{font-size:1.6rem}.item{gap:12px;padding:10px 12px}.date{padding-right:10px}.text{padding:18px}}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.hero h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(2.1rem,5.2vw,3.6rem);line-height:1;letter-spacing:-.01em;margin:10px 0 14px;max-width:none;text-wrap:balance}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:110ch;margin:0}
.hero{padding-block:36px 22px}
.prods.home{margin:0 0 26px}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.stat b{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:2rem;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 .86rem var(--body);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#c4ccd6}
.chip:focus-visible,.item:focus-visible,.back:focus-visible,.pn a:focus-visible,.ph:focus-visible,.btn:focus-visible,.gov:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* linha do tempo */
.month{display:grid;grid-template-columns:150px 1fr;gap:0 28px;padding-block:22px;border-top:1px solid var(--line)}
.month:first-of-type{border-top:0}
.month h2{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:1.25rem;margin:4px 0 0;line-height:1.15}
.month h2 small{display:block;font-family:var(--body);font-stretch:100%;font-weight:500;font-size:.82rem;color:var(--muted);margin-top:4px}
.items{display:grid;gap:10px;min-width:0}
@media (max-width:760px){.month{grid-template-columns:1fr;gap:12px}}

.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.item:hover{border-color:#b8c2cd;box-shadow:0 6px 18px -10px rgba(14,42,69,.35);transform:translateY(-1px)}
.date{text-align:center;border-right:1px solid var(--line);padding-right:14px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.date b{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.date b.sm{font-size:1.05rem}
.date b.xs{font-size:.8rem;font-stretch:90%;letter-spacing:0}
.date span{font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.body{min-width:0}
.type{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.type i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.item h3{font-family:var(--body);font-weight:700;font-size:1.04rem;line-height:1.3;margin:3px 0 2px;text-wrap:balance}
.item p{margin:0;font-size:.86rem;color:var(--muted)}
.thumb{width:128px;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.soon{width:128px;aspect-ratio:16/10;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--muted);text-align:center;padding:6px;background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--sunk) 6px 7px)}
@media (max-width:560px){.item{grid-template-columns:60px minmax(0,1fr)}.thumb,.soon{display:none}.date b{font-size:1.4rem}}

.destaques{margin-bottom:22px}
.grac{margin:4px 0 26px;padding:22px;border-radius:var(--r);background:var(--orange-soft);border:1px solid #f4cdb0}
.grac-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.grac-h h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.6rem;line-height:1.05;margin:4px 0 0}
.grac-h p{margin:0;color:var(--ink-2);font-size:.9rem;max-width:52ch}
.grac-l{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.gc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:box-shadow .15s,transform .15s}
.gc:hover{box-shadow:0 8px 20px -12px rgba(14,42,69,.45);transform:translateY(-1px)}
.gc:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.gc .pic{aspect-ratio:16/8;background:var(--sunk);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;font-weight:600}
.gc .pic img{width:100%;height:100%;object-fit:cover;display:block}
.gc .pic.wait{background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--sunk) 6px 7px)}
.gc .tx{padding:12px 14px 14px}
.gc .dt{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.gc .dt small{font-family:var(--body);font-stretch:100%;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.gc h3{font-size:.98rem;line-height:1.3;margin:6px 0 2px}
.gc p{margin:0;font-size:.82rem;color:var(--muted)}
.gc.on{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
@media (max-width:560px){.grac{padding:16px}.grac-h p{display:none}.gc{flex-direction:row}.gc .pic{aspect-ratio:auto;width:104px;flex:none;align-self:stretch;font-size:.68rem;text-align:center;padding:4px}.gc .tx{padding:10px 12px}.gc p{display:none}.gc .dt small{display:block;margin:4px 0 0}}
.prods{display:grid;gap:12px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.prod{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;transition:border-color .15s,box-shadow .15s}
.prod:hover{border-color:var(--navy);box-shadow:0 6px 18px -12px rgba(14,42,69,.45)}
.prod:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.prod .ic{width:40px;height:40px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff}
.prod .ic.yt{background:#c4302b}
.prod .ic svg{width:20px;height:20px}
.prod small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.prod b{display:block;font-size:1rem;line-height:1.3;margin-top:2px;color:var(--ink)}
.prod span{display:block;font-size:.84rem;color:var(--muted);margin-top:3px;line-height:1.4}
.prod em{font-style:normal;font-size:.76rem;color:var(--navy);font-weight:600;display:block;margin-top:6px;word-break:break-all}
.vids{margin-top:28px}
.vids h3{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:1.3rem;margin:0 0 4px}
@media (min-width:1000px){
  .texts>.text:only-child{columns:2 380px;column-gap:44px}
  .texts>.text:only-child>h3,.texts>.text:only-child>h4{column-span:all}
  .texts>.text:only-child p{max-width:none}
  .texts>.text:only-child li,.texts>.text:only-child tr{break-inside:avoid}
  .split .texts>.text:only-child,.split>.text{columns:auto}
}
.vsplit{grid-template-columns:minmax(0,340px) minmax(0,1fr)!important;align-items:start}
.video{margin:0;min-width:0}
.video video{display:block;width:100%;aspect-ratio:9/16;background:#0b1622;border-radius:var(--r)}
.video figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
@media (max-width:760px){.video{max-width:340px}}
.badge.en{background:#1e5fa8}
.badge.en.big{margin-left:0;font-size:.7rem;padding:3px 8px;text-decoration:none}
.orig{font-size:.78rem!important;color:var(--navy)!important;font-weight:600;margin-top:2px!important}
.marco{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r);background:#e8f0fa;border:1px dashed #9db9dd;color:var(--navy);text-decoration:none;font-size:.9rem;font-weight:600}
.marco b{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.05rem}
.marco span{margin-left:auto}
.marco:hover{border-style:solid}
.chip.tg{margin-left:auto;border-color:#9db9dd;color:var(--navy)}
.chip.tg .sw{width:28px;height:16px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.chip.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.chip.tg[aria-pressed="true"]{background:#1e5fa8;border-color:#1e5fa8;color:#fff}
.chip.tg[aria-pressed="true"] .sw{background:rgba(255,255,255,.45)}
.chip.tg[aria-pressed="true"] .sw::after{left:14px}
@media (max-width:560px){.chip.tg{margin-left:0}}
.hero .elogo{display:block;height:64px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;margin-bottom:14px;border:1px solid var(--line)}
.tab-en[aria-current="page"]{background:#fff;color:#1e5fa8}
.prod{position:relative;padding-right:40px}
.prod .arr{position:absolute;top:14px;right:16px;color:var(--muted);font-weight:700;transition:transform .15s,color .15s}
.prod:hover .arr{color:var(--navy);transform:translate(2px,-2px)}
.enhero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(circle at 96% 0%,rgba(246,167,109,.35),transparent 32%),linear-gradient(120deg,#e9f1fb 0%,#f3f7fc 55%,#fbf6f1 100%)}
.enhero .waves{position:absolute;right:-40px;bottom:-30px;width:min(60%,720px);height:240px}
.enhero .in{position:relative;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:40px 40px}
.enlogo{display:block;height:68px;width:auto;mix-blend-mode:multiply;margin-bottom:18px}
.enpill{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1e5fa8;background:#fff;border:1px solid #c5d8ef;border-radius:99px;padding:5px 12px}
.enhero h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(2rem,4.2vw,3.2rem);line-height:1.02;margin:14px 0 14px;text-wrap:balance;color:var(--ink)}
.enhero h1 span{color:#1e5fa8}
.enhero .lead{max-width:62ch}
.enh-go{display:grid;gap:12px}
.pgo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px 20px;background:rgba(255,255,255,.92);border:1px solid #d3e1f2;border-radius:14px;text-decoration:none;color:var(--ink);box-shadow:0 10px 28px -20px rgba(14,42,69,.55);transition:transform .15s,box-shadow .15s,border-color .15s}
.pgo:hover{transform:translateY(-2px);border-color:#1e5fa8;box-shadow:0 16px 32px -20px rgba(14,42,69,.6)}
.pgo:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.pgo .pic{width:46px;height:46px;border-radius:12px;background:#1e5fa8;color:#fff;display:flex;align-items:center;justify-content:center}
.pgo .pic svg{width:22px;height:22px}
.pgo small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.pgo b{display:block;font-size:1.08rem;line-height:1.25;margin-top:2px}
.pgo .tx span{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}
.pgo .arr{font-size:1.2rem;font-weight:700;color:#1e5fa8;transition:transform .15s}
.pgo:hover .arr{transform:translate(3px,-3px)}
.en-body{padding-top:26px}
@media (max-width:900px){.enhero .in{grid-template-columns:1fr;gap:24px;padding-block:28px}.enhero .waves{width:100%;opacity:.6}.enlogo{height:54px}}
.ctt td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.ctt small{color:var(--muted)}
.docs{display:grid;gap:10px}
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--paper);transition:border-color .15s}
.doc:hover{border-color:var(--navy)}
.doc:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.doc .pdf{flex:none;width:40px;height:48px;border-radius:5px;background:#b42318;color:#fff;font-size:.7rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;letter-spacing:.05em}
.doc b{display:block;font-size:.95rem;line-height:1.3}
.doc small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.gdiag{margin-top:16px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:8px;justify-items:center;overflow-x:auto}
.grow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;width:100%}
.gbox2{min-width:170px;max-width:260px;flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);text-align:center}
.gbox2 b{display:block;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:1.05rem;color:var(--ink)}
.gbox2 span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.3}
.gbox2.core{background:#1e5fa8;border-color:#1e5fa8}
.gbox2.core b,.gbox2.core span{color:#fff}
.gbox2.lead{background:var(--navy);border-color:var(--navy)}
.gbox2.lead b,.gbox2.lead span{color:#fff}
.glink{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gdown{font-size:1.3rem;color:var(--muted);line-height:1}

/* galeria justificada: distribui as fotos em linhas de mesma altura que preenchem a largura */
function layoutGalleries(root){
  (root||app).querySelectorAll(".gallery:not(.solo)").forEach(g=>{
    const items = [...g.querySelectorAll(".ph")];
    if(!items.length) return;
    g.classList.add("jl");
    g.querySelectorAll(".jrow").forEach(r=>{ while(r.firstChild) g.insertBefore(r.firstChild, r); r.remove(); });
    const W = g.clientWidth; if(!W) return;
    const H = parseFloat(getComputedStyle(g).getPropertyValue("--h")) || 250;
    const R = items.map(b=>parseFloat(b.style.getPropertyValue("--r"))||1.33);
    const total = R.reduce((s,x)=>s+x,0), n = R.length;
    let k = Math.max(1, Math.min(n, Math.round(total*H/W)));
    // particiona em k linhas contíguas com somas o mais parecidas possível
    const pre=[0]; R.forEach(x=>pre.push(pre[pre.length-1]+x));
    const tgt = total/k, cost=(i,j)=>{const s=pre[j]-pre[i]; return (s-tgt)*(s-tgt);};
    const D=[...Array(k+1)].map(()=>Array(n+1).fill(Infinity)), P=[...Array(k+1)].map(()=>Array(n+1).fill(0));
    D[0][0]=0;
    for(let r=1;r<=k;r++) for(let j=r;j<=n;j++) for(let i=r-1;i<j;i++){const v=D[r-1][i]+cost(i,j); if(v<D[r][j]){D[r][j]=v;P[r][j]=i;}}
    const cuts=[]; let j=n; for(let r=k;r>0;r--){const i=P[r][j]; cuts.unshift([i,j]); j=i;}
    cuts.forEach(([i,j])=>{
      const row=document.createElement("div"); row.className="jrow";
      const sum=pre[j]-pre[i], natural=sum*H*1.45;
      if(natural < W) row.style.maxWidth = natural+"px";
      items.slice(i,j).forEach((b,x)=>{ b.style.flex = `${R[i+x]} 1 0`; row.appendChild(b); });
      g.appendChild(row);
    });
  });
}
let _rz; window.addEventListener("resize",()=>{clearTimeout(_rz); _rz=setTimeout(()=>layoutGalleries(),120);});

function renderHome(pk){
  const P = PAINEIS[pk];
  const todas = pk==="en" ? ACOES.filter(a=>a.p==="en" || a.en) : ACOES.filter(a=>a.p===pk);
  const lista = todas.filter(a=>!a.destaque);
  const dest = todas.filter(a=>a.destaque);
  const prontas = todas.filter(a=>a.conteudo).length;
  const f = filtro[pk];
  const tiposUsados = Object.entries(P.tipos).filter(([k,t])=>!t.oculto && lista.some(a=>a.tipo===k));
  const chips = [`<button class="chip" data-f="todas" aria-pressed="${f==='todas'}">Todas <small>${lista.length}</small></button>`]
    .concat(tiposUsados.map(([k,t])=>`<button class="chip" data-f="${k}" style="--c:${t.cor}" aria-pressed="${f===k}"><i></i>${t.nome} <small>${lista.filter(a=>a.tipo===k).length}</small></button>`)).join("");
  const gkey = a => pk==="en" && a.p!=="en" ? "fort" : a.g;
  const tipoOk = a => pk==="en" ? (f==='todas'||a.tipo===f||(a.p!=="en"&&f==="ent"&&a.tipo==="ent")) : (f==='todas'||a.tipo===f);
  const grupos = P.grupos.map(g=>{
    let its = lista.filter(a=>gkey(a)===g.k && tipoOk(a) && (!soEN[pk] || a.en));
    if(pk==="en") its = its.slice().sort((x,y)=>(x.dt||"").localeCompare(y.dt||""));
    if(!its.length) return "";
    let html = "", marcou = false;
    its.forEach((a,i)=>{
      if(pk!=="en" && !marcou && a.dt && a.dt>=DECRETO && i>0 && its[i-1].dt && its[i-1].dt<DECRETO){
        html += `<a class="marco" href="#en-decreto"><b>02/07/2026</b> Decreto nº 50.357 institui o Comitê El Niño <span>→</span></a>`; marcou = true;
      }
      html += itemHTML(a, pk);
    });
    return `<section class="month"><h2>${g.nome}<small>${g.sub}</small></h2><div class="items">${html}</div></section>`;
  }).join("");
  const temEN = pk!=="en" && lista.some(a=>a.en);
  const toggle = temEN ? `<button class="chip tg" id="tgEN" aria-pressed="${soEN[pk]}"><span class="sw"></span>Só ações ligadas ao Comitê El Niño <small>${lista.filter(a=>a.en).length}</small></button>` : "";
  const stats = P.stats(lista).concat([[prontas,"com registro publicado"]])
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  const destTopo = pk==="if" ? dest.map(destaqueHTML).join("") : "";
  const destFim  = pk!=="if" ? dest.map(destaqueHTML).join("") : "";
  const enHero = pk==="en" ? `
    <section class="enhero">
      <svg class="waves" viewBox="0 0 600 260" preserveAspectRatio="none" aria-hidden="true">
        ${[0,1,2,3,4,5].map(i=>`<path d="M0 ${60+i*34} C 100 ${30+i*34}, 200 ${90+i*34}, 300 ${60+i*34} S 500 ${30+i*34}, 600 ${60+i*34}" fill="none" stroke="${i<3?'#e2620f':'#1e5fa8'}" stroke-width="3" opacity="${.16+i*.03}"/>`).join("")}
      </svg>
      <div class="in">
        <div class="enh-main">
          <img class="enlogo" src="${IMGSRC(P.logo)}" alt="Comitê de Enfrentamento El Niño RJ">
          <span class="enpill">Desde 02/07/2026 · Decreto nº 50.357</span>
          <h1>Comitê Estadual de Enfrentamento <span>aos Efeitos do El Niño</span></h1>
          <p class="lead">${esc(P.lead)}</p>
        </div>
        <nav class="enh-go" aria-label="Acessos do Comitê">
          ${P.links.map(l=>`<a class="pgo" href="${l.u}" target="_blank" rel="noopener"><span class="pic">${ICON.painel}</span><span class="tx"><small>${esc(l.tag)}</small><b>${esc(l.t)}</b><span>${esc(l.d)}</span></span><span class="arr" aria-hidden="true">↗</span></a>`).join("")}
        </nav>
      </div>
    </section>` : "";
  app.innerHTML = pk==="en" ? `${enHero}
    <section class="in en-body">
      <div class="filters" role="group" aria-label="Filtrar por tipo">${chips}</div>
      ${grupos}
    </section>` : `
    <section class="hero in">
      <div class="eyebrow">${esc(P.eyebrow)}</div>
      ${P.logo?`<img class="elogo" src="${IMGSRC(P.logo)}" alt="Comitê de Enfrentamento El Niño RJ">`:""}
      <h1>${esc(P.h1)}</h1>
      <p class="lead">${esc(P.lead)}</p>
    </section>
    <section class="in">
      ${pk!=="en" ? gracHTML(null,false) : ""}
      ${P.links&&P.links.length?`<div class="prods home">${P.links.map(prodHTML).join("")}</div>`:""}
      ${destTopo ? `<div class="destaques">${destTopo}</div>` : ""}
      <div class="filters" role="group" aria-label="Filtrar por tipo">${chips}${toggle}</div>
      ${grupos}
      ${destFim}
    </section>`;
  app.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{filtro[pk]=b.dataset.f; const y=window.scrollY; renderHome(pk); window.scrollTo(0,y);});
  const tg = document.getElementById("tgEN"); if(tg) tg.onclick=()=>{soEN[pk]=!soEN[pk]; const y=window.scrollY; renderHome(pk); window.scrollTo(0,y);};
}

function route(){
  closeLb();
  const h = location.hash.slice(1);
  const a = ACOES.find(x=>x.id===h);
  const homeP = Object.keys(PAINEIS).find(k=>PAINEIS[k].home===h);
  if (h==="produtos"){ setChrome("ci"); document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current","false")); document.getElementById("moreLink").setAttribute("aria-current","page"); document.getElementById("foot").textContent="SEDEC-RJ · GIGR-SEIF"; renderProdutos(); window.scrollTo(0,0); return; }
  if (a){ setChrome(a.p); renderDetail(a); }
  else { const pk = homeP || "ci"; setChrome(pk); renderHome(pk); }
  layoutGalleries();
  window.scrollTo(0,0);
}

/* ampliação de fotos */
const lb=document.getElementById("lb"), lbImg=document.getElementById("lbImg"), lbCap=document.getElementById("lbCap");
let fotos=[], idx=0, lastFocus=null;
function showLb(){ lbImg.src=fotos[idx].src; lbImg.alt=fotos[idx].alt; lbCap.textContent=`${fotos[idx].alt} · ${idx+1}/${fotos.length}`;
  document.getElementById("lbPrev").hidden=document.getElementById("lbNext").hidden=fotos.length<2; }
function openLb(btn){ const all=[...app.querySelectorAll(".ph")]; fotos=all.map(b=>({src:b.dataset.src,alt:b.querySelector("img").alt}));
  idx=all.indexOf(btn); lastFocus=btn; lb.hidden=false; showLb(); document.getElementById("lbClose").focus(); }
function closeLb(){ if(lb.hidden) return; lb.hidden=true; if(lastFocus&&lastFocus.isConnected) lastFocus.focus(); }
app.addEventListener("click",e=>{const s=e.target.closest("[data-scroll]"); if(s){const el=document.getElementById(s.dataset.scroll); if(el) el.scrollIntoView({behavior:"smooth"}); return;} const b=e.target.closest(".ph"); if(b) openLb(b);});
document.getElementById("lbClose").onclick=closeLb;
document.getElementById("lbPrev").onclick=()=>{idx=(idx-1+fotos.length)%fotos.length;showLb();};
document.getElementById("lbNext").onclick=()=>{idx=(idx+1)%fotos.length;showLb();};
lb.addEventListener("click",e=>{if(e.target===lb) closeLb();});
document.addEventListener("keydown",e=>{ if(lb.hidden) return;
  if(e.key==="Escape") closeLb(); if(e.key==="ArrowLeft") document.getElementById("lbPrev").click(); if(e.key==="ArrowRight") document.getElementById("lbNext").click(); });

window.addEventListener("hashchange", route);
route();
</script>
